<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DEV SOLD: a real-estate sign. The listing agent is make.fun, where the agents are AI agents. -->
  <rect width="1024" height="1024" fill="#ffd21f"/>
  <!-- post and arm -->
  <rect x="120" y="70" width="64" height="940" fill="#5a3a1e" stroke="#111" stroke-width="20"/>
  <rect x="120" y="120" width="790" height="54" fill="#5a3a1e" stroke="#111" stroke-width="20"/>
  <!-- chains -->
  <line x1="320" y1="174" x2="320" y2="250" stroke="#111" stroke-width="18"/>
  <line x1="810" y1="174" x2="810" y2="250" stroke="#111" stroke-width="18"/>
  <!-- DEV plank -->
  <rect x="290" y="240" width="550" height="150" rx="16" fill="#ffffff" stroke="#111" stroke-width="22"/>
  <text x="565" y="356" text-anchor="middle" font-family="Arial" font-weight="900" font-size="128" fill="#111">DEV</text>
  <line x1="320" y1="390" x2="320" y2="440" stroke="#111" stroke-width="18"/>
  <line x1="810" y1="390" x2="810" y2="440" stroke="#111" stroke-width="18"/>
  <!-- SOLD sign -->
  <rect x="240" y="430" width="650" height="330" rx="22" fill="#e3262b" stroke="#111" stroke-width="26"/>
  <rect x="272" y="462" width="586" height="266" rx="12" fill="none" stroke="#ffffff" stroke-width="12"/>
  <text x="565" y="662" text-anchor="middle" font-family="Arial" font-weight="900" font-size="190" fill="#ffffff">SOLD</text>
  <!-- rider: the listing agent -->
  <line x1="320" y1="760" x2="320" y2="800" stroke="#111" stroke-width="18"/>
  <line x1="810" y1="760" x2="810" y2="800" stroke="#111" stroke-width="18"/>
  <rect x="290" y="795" width="550" height="130" rx="16" fill="#ffffff" stroke="#111" stroke-width="22"/>
  <text x="565" y="845" text-anchor="middle" font-family="Arial" font-weight="900" font-size="38" fill="#e3262b">AGENT:</text>
  <text x="565" y="905" text-anchor="middle" font-family="Arial" font-weight="900" font-size="62" fill="#111">make.fun</text>
</svg>
